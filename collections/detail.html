<script type="text/javascript">
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('id');
    const isAdd = urlParams.get('add') === 'new';
    
    function loadCollections() {
        const saved = localStorage.getItem('collections');
        return saved ? JSON.parse(saved) : [];
    }
    
    function saveCollections(items) {
        localStorage.setItem('collections', JSON.stringify(items));
    }
    
    function renderDetail(item, isEditMode) {
        const content = document.getElementById('detailContent');
        if (!item && !isAdd) {
            content.innerHTML = '<p>条目不存在</p>';
            return;
        }
        
        if (isEditMode || isAdd) {
            const items = loadCollections();
            const currentItem = isAdd ? null : items.find(i => String(i.id) === String(itemId));
            
            content.innerHTML = `
                <div class="edit-mode">
                    <h2>${isAdd ? '添加新条目' : '编辑条目'}</h2>
                    <form id="editForm" class="edit-form">
                        <div class="form-group">
                            <label>类别</label>
                            <select id="typeInput">
                                <option value="书籍"${currentItem?.type === '书籍' ? ' selected' : ''}>书籍</option>
                                <option value="电影"${currentItem?.type === '电影' ? ' selected' : ''}>电影</option>
                                <option value="剧集"${currentItem?.type === '剧集' ? ' selected' : ''}>剧集</option>
                                <option value="游戏"${currentItem?.type === '游戏' ? ' selected' : ''}>游戏</option>
                                <option value="音乐"${currentItem?.type === '音乐' ? ' selected' : ''}>音乐</option>
                                <option value="其他"${currentItem?.type === '其他' ? ' selected' : ''}>其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>标题</label>
                            <input type="text" id="nameInput" value="${currentItem?.name || ''}" required>
                        </div>
                        <div class="form-group">
                            <label>封面图片URL</label>
                            <input type="text" id="imageInput" value="${currentItem?.image || ''}" placeholder="https://example.com/cover.jpg">
                        </div>
                        <div class="form-group">
                            <label>简介</label>
                            <textarea id="introInput" rows="3">${currentItem?.intro || ''}</textarea>
                        </div>
                        <div class="form-group">
                            <label>详细内容</label>
                            <textarea id="detailInput" rows="10" placeholder="在这里写笔记、感想或观后感">${currentItem?.detail || ''}</textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='/collections/'">取消</button>
                        </div>
                    </form>
                </div>
            `;
            
            document.getElementById('editForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const items = loadCollections();
                const data = {
                    id: currentItem?.id || Date.now(),
                    type: document.getElementById('typeInput').value,
                    name: document.getElementById('nameInput').value,
                    image: document.getElementById('imageInput').value || '/images/avatar.webp',
                    intro: document.getElementById('introInput').value,
                    detail: document.getElementById('detailInput').value
                };
                
                if (currentItem) {
                    const index = items.findIndex(i => String(i.id) === String(itemId));
                    items[index] = data;
                } else {
                    items.push(data);
                }
                saveCollections(items);
                window.location.href = '/collections/detail.html?id=' + data.id;
            });
        } else {
            content.innerHTML = `
                <div class="detail-content">
                    <div class="detail-cover">
                        <img src="${item.image}" onerror="this.src='/images/avatar.webp';this.onerror=null;" alt="${item.name}">
                    </div>
                    <div class="detail-info">
                        <h1 class="detail-title">${item.name}</h1>
                        <div class="detail-intro">${item.intro || '暂无简介'}</div>
                    </div>
                </div>
                <div class="detail-body">
                    <h2>详细内容</h2>
                    <div class="detail-body-content">${item.detail || '还没有添加详细内容'}</div>
                </div>
                <div class="edit-toggle">
                    <button class="btn btn-primary" onclick="window.location.href='/collections/detail.html?id=${item.id}&edit=true'">编辑</button>
                </div>
            `;
        }
    }
    
    if (isAdd) {
        renderDetail(null, true);
    } else if (itemId) {
        const items = loadCollections();
        const item = items.find(i => String(i.id) === String(itemId));
        const isEdit = urlParams.get('edit') === 'true';
        renderDetail(item, isEdit);
    } else {
        document.getElementById('detailContent').innerHTML = '<p>参数错误</p>';
    }
})();
</script></div>
